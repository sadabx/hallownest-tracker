<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">Hallownest atlas</title>
  <desc id="desc">An original stylized map of Hallownest's connected regions.</desc>

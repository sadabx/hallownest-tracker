    <radialGradient id="paper" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#17343b"/>
      <stop offset="1" stop-color="#071419"/>
    </radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#31575a"/>
      <stop offset="1" stop-color="#142e34"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#91c8c0" stroke-opacity=".05"/>
    </pattern>
  </defs>
